server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headroom over the backend's MAX_UPLOAD_MB (default 50).
    client_max_body_size 60M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every backend route the frontend calls, proxied to the api container so
    # the browser only ever talks to one origin — no CORS needed in the
    # Docker build (see main.py's CORS comment for the dev-server exception).
    location ~ ^/(documents|search|query|agent|conversations|health) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";

        # /query/stream and /agent/query/stream are Server-Sent Events —
        # without this nginx buffers the whole response and delivers it in
        # one chunk once the backend finishes, which defeats streaming.
        proxy_buffering off;
        proxy_cache off;

        # Generation on a CPU-only local model takes up to ~70s (see the
        # Phase 7 measurements in ARCHITECTURE.md); the default 60s proxy
        # timeout would cut a slow answer off mid-stream.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
