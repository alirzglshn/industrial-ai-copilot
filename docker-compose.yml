services:
  frontend:
    build:
      context: ./frontend
    ports:
      # The one URL to open: http://localhost:3000. nginx inside this
      # container serves the built React app and reverse-proxies every API
      # path to the api service (see frontend/nginx.conf) — the browser only
      # ever talks to this one origin, on this one port.
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ./src:/app/src
      # Uploaded PDFs and images extracted from them, kept out of the image so
      # they survive rebuilds.
      - ./data:/app/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.10.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
